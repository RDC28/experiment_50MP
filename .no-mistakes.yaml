# Per-repo no-mistakes overrides.

# Fixed light commands so the pipeline never improvises its own harness. Notebooks, model inference,
# conversions and full-size pipeline runs are Colab-only. Notebook and model tests are already opt-in
# behind SYNTHETIC_RAW_LAB_HEAVY_TESTS=1, which stays unset here; the --ignore list below skips the
# test files that run the end-to-end pipeline, even on tiny inputs. They still run in a plain
# `python -m pytest` and on Colab.
commands:
  test: >-
    env -u SYNTHETIC_RAW_LAB_HEAVY_TESTS python -m pytest -q
    --ignore=tests/test_pipeline.py
    --ignore=tests/test_pipeline_sr.py
    --ignore=tests/test_night_pipeline.py
    --ignore=tests/test_universal_pipeline.py
    --ignore=tests/test_human_run.py
    --ignore=tests/synthraw/test_synthraw_pipeline.py
    --ignore=tests/synthraw/test_validation_runner.py
    --ignore=tests/synthraw/test_notebook_run_all.py
    --ignore=tests/synthraw/test_report.py
  lint: 'ruff check . && ruff format --check .'
