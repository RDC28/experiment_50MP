# PRD 18.1 implemented human/crowd profile. Every leaf is documented by
# synthetic_raw_lab.human_config.parameter_table(), including inherited defaults.
# Generative face replacement and background-face restoration are prohibited.
# Shared SR tiling, device, precision and weights defaults come from Phase 2.
profile: human_crowd
input_category: human
target_megapixels: 50.0
sr_backend: swinir # swinir | realesrgan | lanczos_stand_in (explicit interpolation)
sr_modes: [conservative, balanced] # required: conservative final; balanced comparison (PRD 18.1)
general_sr_strength: 1.0 # [0, 1]: Lanczos to selected output; high values retain backend artifacts
edge_sharpening: 0.0 # [0, 1]: bounded unsharp, observed faces excluded; high values risk halos
skin_texture_smoothing: 0.0 # [0, 1]: bounded bilateral skin smoothing, capped by face strengths
grain: 0.0 # [0, 1]: seeded achromatic random texture; faces excluded, not recovered detail
tonal_contrast: 0.0 # [-0.5, 0.5]: log-luminance slope around 0.18; high values risk clipping
colour_balance: [1.0, 1.0, 1.0] # each [0.5, 1.5]: linear RGB gains; unequal gains shift skin
runtime_preset: standard # quick: 1.5x the source pixel count, at most target_megapixels
face_detector: yunet # checksum-verified runtime weights; haar is optional; none disables inference
manual_face_boxes: [] # source [x, y, width, height, optional confidence]
primary_subject_index: null # highest source tier, then largest area; manual index overrides
face_tiers: # to be calibrated experimentally
  tier1_min_pixels: 96
  tier2_min_pixels: 32
  tier1_min_confidence: 0.9
  tier2_min_confidence: 0.6
identity: # consistency gates, not identity proof
  min_ssim: 0.8
  max_color_difference: 5.0
  max_skin_shift: 4.0
  max_edge_displacement: 1.0
  max_landmark_displacement_normalized: 0.05 # maximum / source shortest face side; to be calibrated experimentally
  retry_strength: 0.25
regions: # simulated bounded microcontrast, provisional low/moderate strengths
  skin: 0.05
  hair: 0.25
  clothing: 0.25
  hands: 0.05
  background: 0.25
  primary_face: 0.0
  background_faces: 0.0
  bokeh: 0.0
  radius_pixels: 1.0
  max_detail: 0.02
export_tiff16: true
export_exr: true
exr_precision: half
export_review: true
